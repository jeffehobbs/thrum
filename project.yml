name: Thrum
options:
  bundleIdPrefix: com.jeffhobbs
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: YKF353373Y
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
targets:
  Thrum:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      - path: Assets.xcassets
        optional: true
    info:
      path: App/Info.plist
      properties:
        # XcodeGen rewrites App/Info.plist on every generate and its own default
        # for these two is a hardcoded 1.0 / 1 — editing the plist by hand or
        # bumping MARKETING_VERSION alone silently ships the old number. Point
        # them at the build settings so there is one source of truth below.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Thrum
        NSMotionUsageDescription: Thrum reads the orientation of your AirPods so the drone can stay where it is in the room when you turn your head. Nothing is recorded or sent anywhere.
        CFBundleIconFile: AppIcon
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Jeff Hobbs"
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeffhobbs.thrum
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "3"
