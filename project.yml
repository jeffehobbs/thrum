name: Thrum
options:
  bundleIdPrefix: com.jeffhobbs
  deploymentTarget:
    macOS: "14.0"
    tvOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: YKF353373Y
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
packages:
  # The lock screen and the car, shared by all five Phonotropic apps.
  Dashboard:
    path: ../dashboard
  # The Phonotropic workout: the watch app, the iPhone's link to it, and the
  # Live Activity — shared by the Phonotropic apps, hence a package on disk.
  # It replaced Cadence: the heart rate now comes from a workout the watch
  # runs while the drone plays.
  PhonotropicWorkout:
    path: ../phonotropic-workout
  # The link to Meter and Echo: one tempo, one key, one downbeat across three
  # separate apps running side by side. macOS only — it rests on every
  # participant reading the same mach uptime clock and on a cross-process
  # notification, neither of which means anything on the phone, and ThrumFlow
  # is a thing you leave playing with nothing beside it anyway.
  Ensemble:
    path: ../ensemble
  # Six consumable tips, unlocking nothing — shared with Field, Meter and
  # Plasma. iOS only: the Mac app has never had a tip jar.
  TipJar:
    path: ../tipjar
  # Sparkle ships an XCFramework as its SPM product; the command-line tools
  # (generate_keys, generate_appcast, sign_update) are NOT in the package and
  # come from the release tarball instead — build.sh fetches them on demand.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.4"
targets:
  Thrum:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      - path: Assets.xcassets
        optional: true
    dependencies:
      - package: Sparkle
      - package: Ensemble
    info:
      path: App/Info.plist
      properties:
        # XcodeGen rewrites App/Info.plist on every generate and its own default
        # for these two is a hardcoded 1.0 / 1 — editing the plist by hand or
        # bumping MARKETING_VERSION alone silently ships the old number. Point
        # them at the build settings so there is one source of truth below.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Thrum
        NSMotionUsageDescription: Thrum reads the orientation of your AirPods so the drone can stay where it is in the room when you turn your head. Nothing is recorded or sent anywhere.
        CFBundleIconFile: AppIcon
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Jeff Hobbs"
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        # Sparkle. These live here rather than in App/Info.plist for the reason
        # at the top of this block: XcodeGen rewrites that file on every
        # generate, so a feed URL edited by hand would silently disappear and
        # the app would ship with no way to find updates.
        #
        # SUPublicEDKey is the Ed25519 *public* key. Its private half lives in
        # the login keychain and is the one irreplaceable artifact in this whole
        # setup — lose it and installed copies can never be updated again,
        # because they will refuse anything not signed by it.
        SUFeedURL: https://jeffehobbs.github.io/thrum/appcast.xml
        SUPublicEDKey: 78VIUMsV79OFfJAVHC3EdvezY8UAqUBTEoMqi9qjRdo=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeffhobbs.thrum
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "1.4.1"
        # Sparkle orders releases by CFBundleVersion, not by the marketing
        # string, so this is the number that decides whether an installed copy
        # thinks an update exists. It must go up every single release.
        CURRENT_PROJECT_VERSION: "8"

  # Thrum Flow — the passive iOS/iPadOS build. Same engine, no instrument: Flow
  # plays it and a Metal field shows what it is doing.
  #
  # Shares `Shared/` verbatim with the Mac app rather than forking it. That was
  # only possible because ten of its eleven files were already platform-neutral;
  # AudioRoute was the exception and is now split with `#if os(macOS)` around the
  # CoreAudio HAL, since iOS answers the same question through AVAudioSession.
  # `App/` (Launchpad, Launch Control, Sparkle) is macOS-only and stays out.
  ThrumFlow:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    # `iOS/Assets.xcassets` is its own catalog rather than the Mac app's, because
    # the two platforms need incompatible artwork: the macOS icon is an inset tile
    # with rounded corners and a transparent margin, and iOS refuses any alpha
    # channel at all (ITMS-90717) and masks its own corners. Both are rendered
    # from Tools/icon — `--ios` gives the full-bleed opaque variant.
    sources:
      - iOS
      - Shared
    dependencies:
      - package: PhonotropicWorkout
        product: PhonotropicWorkout
      - package: PhonotropicWorkout
        product: PhonotropicWorkoutActivity
      - package: TipJar
      - package: Dashboard
      - target: ThrumWatch
      - target: ThrumWorkoutWidget
    info:
      path: iOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Thrum
        LSApplicationCategoryType: public.app-category.music
        # The whole premise: keep playing with the screen off. Without this the
        # drone stops the moment the phone locks, which is when a passive
        # ambient app is most likely to be wanted.
        UIBackgroundModes: [audio]
        # CoreMotion, only for AirPods orientation now: the pulse comes from the
        # watch's workout rather than from an estimate made of movement.
        NSMotionUsageDescription: Thrum reads the orientation of your AirPods so the drone can stay where it is in the room when you turn your head. Nothing is recorded or sent anywhere.
        NSHealthShareUsageDescription: With Music Accompanies Heart Rate on, Thrum reads the heart rate your Apple Watch measures during its workout, so the drone's pulse beats with yours, and shows your Activity rings on the watch. Nothing leaves your devices.
        NSHealthUpdateUsageDescription: With Music Accompanies Heart Rate on, Thrum saves each listen as a workout in Health — its time, heart rate, calories, distance, elevation and route.
        # The workout on the lock screen and in the Dynamic Island.
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIColorName: ""
        # Every orientation on both idioms — this is a thing you prop up and
        # leave, so which way up it happens to be is not our business.
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        # Declared here so App Store Connect stops asking per build. Thrum uses no
        # encryption of its own and nothing beyond what the OS provides, which is
        # the exempt case — the question is otherwise a manual gate on every
        # single TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
        # CarPlay arrives as a second UIScene, which means declaring a scene
        # manifest — and once you declare one, you must declare *every* role you
        # use, including the ordinary window scene SwiftUI would otherwise have
        # set up implicitly. The window role therefore appears with a name and no
        # delegate class: SwiftUI still manages it. Omitting it launches to a
        # black screen, which looks nothing like a manifest problem.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
            CPTemplateApplicationSceneSessionRoleApplication:
              # The delegate lives in the Dashboard package, so it is named by
              # its explicit Objective-C name rather than
              # $(PRODUCT_MODULE_NAME) — the class is not in this module.
              - UISceneConfigurationName: Thrum CarPlay
                UISceneClassName: CPTemplateApplicationScene
                UISceneDelegateClassName: DashboardCarPlaySceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeffhobbs.thrumflow
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # HealthKit and the shared App Group, and — by default — CarPlay. Set here
        # rather than only at archive time, which is where the CarPlay entitlement
        # used to live alone: HealthKit has to be in *every* build or a device run
        # from Xcode silently cannot read a heart rate, which looks exactly like the
        # estimate being bad. `CARPLAY=0 ./build.sh testflight` swaps in
        # ThrumFlow-NoCarPlay.entitlements, which is this file minus that one key.
        # Swapped by `CARPLAY=0 ./build.sh testflight`, through a variable only
        # this target reads.
        THRUMFLOW_ENTITLEMENTS: iOS/ThrumFlow.entitlements
        CODE_SIGN_ENTITLEMENTS: $(THRUMFLOW_ENTITLEMENTS)
        # 1 = iPhone, 2 = iPad. Both, and the layout is centred and unconstrained
        # so there is nothing idiom-specific to maintain.
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: "1.2.0"
        # Uploaded to TestFlight so far, checked against App Store Connect rather
        # than remembered:
        #
        #   1.0.0  build 1   2026-08-08
        #   1.0.0  build 2   2026-08-09
        #   1.0.0  build 3   2026-08-10   head-tracking wrap/slew fix, thumbs layout
        #   1.0.1  build 9   2026-08-14   the real warble fix — the head-tracking
        #                                 transport smooths a quaternion instead of
        #                                 three Euler angles. See `HeadSmoother`.
        #   1.1.0  build ?   2026-09-08   follow-my-pulse (Cadence) and the head-
        #                                 tracking switch, both behind the gear
        #
        # This list was wrong for three weeks — it claimed 1 and 3 while 9 was live —
        # which is what a hand-kept record does. `asc.py` answers the question in one
        # call, so check before editing:
        #
        #   cd ~/.appstoreconnect && python3 -c "import asc; \
        #     print([(d['attributes']['version'], d['attributes']['uploadedDate'][:10]) \
        #            for d in asc.request('/v1/builds?filter[app]=6799441904&limit=10&sort=-uploadedDate')['data']])"
        #
        # App Store Connect rejects a build number it has already seen, so this goes
        # up before the next build rather than after a failure. It is not the last
        # word though: `./build.sh testflight` exports with
        # `manageAppVersionAndBuildNumber` on, so Xcode asks App Store Connect what it
        # has seen and bumps past it at export time — which is how an archive of 2
        # became build 3. Keep this current anyway; it is the only record in the repo
        # of what has actually shipped.
        CURRENT_PROJECT_VERSION: "15"
        # Metal shaders are compiled from iOS/Shaders.metal by the default build
        # rule; -O keeps the fragment loop tight, which matters at 5 M pixels.
        MTL_ENABLE_DEBUG_INFO: NO
        MTL_FAST_MATH: YES
        # For `./build.sh device`: profiles minted through the App Store Connect
        # API (../cadence/Tools/mint-profile.py), named per target and picked up
        # by DeviceSigning.xcconfig.
        DEVICE_PROFILE: "Thrum Flow Development"

  # Thrum on the wrist: the shared Phonotropic workout app, with Thrum's name,
  # color and icon. Started by the phone when play is pressed.
  ThrumWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - Watch
    dependencies:
      - package: PhonotropicWorkout
        product: PhonotropicWorkoutWatch
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Thrum
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.jeffhobbs.thrumflow
        WKRunsIndependentlyOfCompanionApp: false
        WKBackgroundModes: [workout-processing]
        UIBackgroundModes: [location]
        NSHealthShareUsageDescription: Thrum reads your heart rate during its workout and sends it to your iPhone, so the drone beats with your pulse, and shows your Activity rings.
        NSHealthUpdateUsageDescription: Thrum saves each listen as a workout in Health, with its heart rate, calories, distance, elevation and route.
        NSLocationWhenInUseUsageDescription: Thrum records the route of your workout, so Fitness can draw it on a map.
        NSMotionUsageDescription: Thrum uses the barometer to measure the elevation you gain during a workout.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeffhobbs.thrumflow.watchkitapp
        PRODUCT_NAME: Thrum Watch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Watch/ThrumWatch.entitlements
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "15"
        DEVICE_PROFILE: "Thrum Watch Development"

  # The workout's Live Activity. All of it is the shared one; this contributes
  # the icon.
  ThrumWorkoutWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Widget
    dependencies:
      - package: PhonotropicWorkout
        product: PhonotropicWorkoutActivity
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Thrum Workout
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeffhobbs.thrumflow.WorkoutWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "15"
        DEVICE_PROFILE: "Thrum Workout Widget Development"

  # Thrum for Apple TV — the room-scale build. Same engine, Flow plays it, a
  # lava field shows it, and play/pause on the remote is the only control.
  #
  # No settings, by design: the phone has the switches, and what the listener
  # has taught Flow arrives from the phone through iCloud (`TasteCloud`). The
  # sound is rendered to 5.1 when the HDMI sink offers it — see `TV/TVHost.swift`
  # and `Tools/surround` for what that took — and to stereo otherwise.
  #
  # `Shared/` compiles unchanged except for two fences: `HeadTracker` has a
  # tvOS stub because CoreMotion does not exist in the tvOS SDK, and
  # `AudioRoute`'s AVAudioSession branch is `#else` rather than `#elseif os(iOS)`.
  # None of the packages come along: PhonotropicWorkout is heart rate, TipJar and Dashboard
  # are the phone's, Ensemble is the Mac's.
  ThrumTV:
    type: application
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - TV
      - Shared
      - path: TV/Assets.xcassets
        optional: true
    info:
      path: TV/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Thrum
        LSApplicationCategoryType: public.app-category.music
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
    settings:
      base:
        # The phone's bundle identifier, deliberately: App Store Connect holds iOS
        # and tvOS in one record only when they share one (Chronological does the
        # same). The App ID already carries the iCloud key-value entitlement the
        # sync needs; it must stay enabled for both platforms.
        PRODUCT_BUNDLE_IDENTIFIER: com.jeffhobbs.thrumflow
        CODE_SIGN_ENTITLEMENTS: TV/ThrumTV.entitlements
        # tvOS icons are a brand-asset stack, not an appiconset. Generated by
        # Tools/tvicons.py from Tools/tvicon.
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        TARGETED_DEVICE_FAMILY: "3"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        MTL_ENABLE_DEBUG_INFO: NO
        MTL_FAST_MATH: YES
