name: Thrum
options:
  bundleIdPrefix: com.jeffhobbs
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: YKF353373Y
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
packages:
  # Sparkle ships an XCFramework as its SPM product; the command-line tools
  # (generate_keys, generate_appcast, sign_update) are NOT in the package and
  # come from the release tarball instead — build.sh fetches them on demand.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.4"
targets:
  Thrum:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      - path: Assets.xcassets
        optional: true
    dependencies:
      - package: Sparkle
    info:
      path: App/Info.plist
      properties:
        # XcodeGen rewrites App/Info.plist on every generate and its own default
        # for these two is a hardcoded 1.0 / 1 — editing the plist by hand or
        # bumping MARKETING_VERSION alone silently ships the old number. Point
        # them at the build settings so there is one source of truth below.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Thrum
        NSMotionUsageDescription: Thrum reads the orientation of your AirPods so the drone can stay where it is in the room when you turn your head. Nothing is recorded or sent anywhere.
        CFBundleIconFile: AppIcon
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Jeff Hobbs"
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        # Sparkle. These live here rather than in App/Info.plist for the reason
        # at the top of this block: XcodeGen rewrites that file on every
        # generate, so a feed URL edited by hand would silently disappear and
        # the app would ship with no way to find updates.
        #
        # SUPublicEDKey is the Ed25519 *public* key. Its private half lives in
        # the login keychain and is the one irreplaceable artifact in this whole
        # setup — lose it and installed copies can never be updated again,
        # because they will refuse anything not signed by it.
        SUFeedURL: https://jeffehobbs.github.io/thrum/appcast.xml
        SUPublicEDKey: 78VIUMsV79OFfJAVHC3EdvezY8UAqUBTEoMqi9qjRdo=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeffhobbs.thrum
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "1.4.0"
        # Sparkle orders releases by CFBundleVersion, not by the marketing
        # string, so this is the number that decides whether an installed copy
        # thinks an update exists. It must go up every single release.
        CURRENT_PROJECT_VERSION: "7"
